<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment Form | JsonPowerDB</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="https://login2explore.com/jpdb/resources/js/0.0.4/jpdb-commons.js"></script>
    <style>
        body {
            background: #f5f7fa;
            padding-top: 35px;
        }

        .form-card {
            max-width: 850px;
            margin: auto;
            background: #ffffff;
            padding: 32px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .form-title {
            text-align: center;
            margin-bottom: 28px;
            font-weight: 600;
        }

        .button-row {
            text-align: center;
            margin-top: 25px;
        }

        .button-row .btn {
            min-width: 100px;
            margin: 0 5px;
        }

        .required-note {
            color: #777;
            margin-bottom: 18px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="form-card">

        <h2 class="form-title">Student Enrollment Form</h2>
        <p class="required-note">Student Enrollment Form using JsonPowerDB</p>

        <form id="studentForm" onsubmit="return false;">
            <div class="form-group">
                <label for="rollNo">Roll No:</label>
                <input type="text"
                       class="form-control"
                       id="rollNo"
                       placeholder="Enter Roll Number"
                       onchange="getStudent();">
            </div>

            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text"
                       class="form-control"
                       id="fullName"
                       placeholder="Enter Full Name">
            </div>

            <div class="form-group">
                <label for="studentClass">Class:</label>
                <input type="text"
                       class="form-control"
                       id="studentClass"
                       placeholder="Enter Class">
            </div>

            <div class="form-group">
                <label for="birthDate">Birth Date:</label>
                <input type="date"
                       class="form-control"
                       id="birthDate">
            </div>

            <div class="form-group">
                <label for="address">Address:</label>
                <textarea class="form-control"
                          id="address"
                          rows="3"
                          placeholder="Enter Address"></textarea>
            </div>

            <div class="form-group">
                <label for="enrollmentDate">Enrollment Date:</label>
                <input type="date"
                       class="form-control"
                       id="enrollmentDate">
            </div>

            <div class="button-row">
                <button type="button"
                        class="btn btn-success"
                        id="save"
                        onclick="saveStudent();"
                        disabled>
                    Save
                </button>

                <button type="button"
                        class="btn btn-primary"
                        id="update"
                        onclick="updateStudent();"
                        disabled>
                    Update
                </button>

                <button type="button"
                        class="btn btn-default"
                        id="reset"
                        onclick="resetForm();"
                        disabled>
                    Reset
                </button>
            </div>

        </form>
    </div>
</div>

<script src="index.js"></script>

</body>
</html>
